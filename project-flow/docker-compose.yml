services:
  backend:
    image: abhinav775/postman-flow:backend
    container_name: project-flow-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/api-flow-tester
      FRONTEND_URL: http://localhost:8180
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      - mongodb
    ports:
      - "5102:5000"

  mongodb:
    image: mongo:7
    container_name: project-flow-mongodb
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27019:27017"

  legacy-frontend:
    image: abhinav775/postman-flow:frontend
    container_name: project-flow-legacy-frontend
    restart: unless-stopped
    ports:
      - "8180:80"

  frontend-bridge:
    build:
      context: ./frontend-bridge
      args:
        VITE_LEGACY_FRONTEND_PUBLIC_URL: http://localhost:8180
    container_name: project-flow-frontend-bridge
    restart: unless-stopped
    depends_on:
      - legacy-frontend
    ports:
      - "4274:80"

  host:
    build:
      context: ./host
      args:
        VITE_REMOTE_ENTRY_URL: http://localhost:4274/remoteEntry.js
    container_name: project-flow-host
    restart: unless-stopped
    depends_on:
      - frontend-bridge
      - backend
    ports:
      - "3301:80"

volumes:
  mongo_data:
